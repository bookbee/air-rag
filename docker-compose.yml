# air-rag — this service, and nothing else.
#
# No dependency on air-infra's stack in Phase 0. The one real dependency is
# air-llm, its own standalone service on its own network — reached over the
# host (host.docker.internal), exactly like air-classifier and air-tools
# reach it.
#
#   cd ../air-llm && make up          # once, before this — models/embeddings
#   make up                           # here
#
# In production none of this applies: DevOps supplies AIR_RAG__LLM__BASE_URL
# against a managed air-llm endpoint, and this compose file is not deployed.
name: air-rag

services:
  air-rag:
    build:
      context: .
      target: runtime
    image: air-rag:local
    ports:
      # Host side is 8087, this service's slot in the AIR port map
      # (air-infra/README.md). Container side stays 8080.
      - "${AIR_RAG_PORT:-8087}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AIR_RAG__APP__ENV: development
      AIR_RAG__OBS__LOG_FORMAT: console
      AIR_RAG__OBS__LOG_LEVEL: INFO
      AIR_RAG__LLM__BASE_URL: http://host.docker.internal:8083
      # One known development key, baked in. Raw value: airr_local_dev_key.
      AIR_RAG__SECURITY__HASH_SALT: air-rag-dev-salt
      AIR_RAG__SECURITY__API_KEYS_INLINE: >-
        [{"id":"local-dev","name":"Local development",
        "key_hash":"793c2ca4f19409e8a6e26791b2a933d9ee89caa71449eb157691f8735454b082",
        "scopes":["retrieval:read","admin:read"]}]
      AIR_RAG__SECURITY__ALLOW_UNAUTHENTICATED: "false"
    restart: unless-stopped
